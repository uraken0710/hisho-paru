<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="秘書っぱる">
<title>秘書っぱる ⚾</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════ CSS VARIABLES + DARK MODE ══════════════ */
:root {
  --lime:#6AAF00;--lime2:#88CC00;--limebg:#EEFFAA;
  --bg:#F4FDE8;--card:#FFFFFF;
  --border:#BEDD60;--border2:#96C400;
  /* #71: WCAG AA準拠カラー（コントラスト比4.5:1以上） */
  --text:#142200;--text2:#1E3600;
  --muted:#3D5C00;--muted2:#527A00;   /* 旧 #6A8030→暗くして読みやすく */
  --accent:#CC6600;--pink:#CC2266;--red:#CC1111;--blue:#0066CC;
  --morning:#FFF5D0;--afternoon:#E0F0FF;--evening:#F0E0FF;
  --skip:#CC5500;--skipbg:#FFF0E0;
  --tab-h:60px;
  /* FAB用 */
  --fab-size:52px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --limebg:#1A3000;--bg:#0C1606;--card:#182808;
    --border:#284010;--border2:#375515;
    /* #71 dark: 暗背景でも十分な明るさ */
    --text:#E8FFB0;--text2:#CCEE88;
    --muted:#AACE44;--muted2:#607A22;
    --morning:#20180A;--afternoon:#080F1E;--evening:#140A22;
    --skipbg:#221000;
  }
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);font-family:'M PLUS Rounded 1c',sans-serif;color:var(--text);overflow:hidden;}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
input,select,textarea{font-family:'M PLUS Rounded 1c',sans-serif;}
select option{background:var(--card);color:var(--text)}
a{color:var(--lime);text-decoration:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes checkAnim{0%{transform:scale(.8)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes fadeOut{0%{opacity:1;max-height:80px;margin-bottom:5px;padding:10px 12px}100%{opacity:0;max-height:0;margin-bottom:0;padding:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
.task-fading{animation:fadeOut .4s ease forwards;}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;background:var(--bg);padding-bottom:var(--tab-h);}

/* 通常タブ：縦スクロール */
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:68px;position:relative;min-height:0;}

/* チャット専用：flexコンテナに切り替え */
#content.chat-mode{
  overflow:hidden;
  padding-bottom:0;
  display:flex;
  flex-direction:column;
}

.view{display:none;}
.view.active{display:block;}

/* チャットviewはflexコンテナとして高さを埋める */
#view-chat{
  display:none;
  flex-direction:column;
  flex:1;
  min-height:0; /* iOS Safari必須 */
  overflow:hidden;
}
#view-chat.active{
  display:flex;
}

/* ── HERO HEADER ── */
#header{flex-shrink:0;}
#header-hero{position:relative;height:190px;background:#000;overflow:hidden;cursor:pointer;}
#header-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;background:#000;display:block;}
#header-hero-placeholder{width:100%;height:100%;background:linear-gradient(135deg,var(--lime),var(--lime2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;}
#header-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3) 0%,transparent 35%,rgba(0,0,0,.55) 100%);}
#header-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px 0;}
#header-bottom{position:absolute;bottom:0;left:0;right:0;padding:0 14px 8px;}
.h-greeting{color:white;font-weight:900;font-size:.88rem;line-height:1.4;text-shadow:0 1px 6px rgba(0,0,0,.5);}
.h-date{color:rgba(255,255,255,.8);font-size:.63rem;margin-top:2px;}
.h-streak{color:white;font-size:.72rem;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.4);}
#header-prog{padding:4px 14px 5px;background:var(--lime);display:flex;align-items:center;gap:8px;}
.hprog-bar{flex:1;height:5px;background:rgba(255,255,255,.3);border-radius:10px;overflow:hidden;}
.hprog-fill{height:100%;background:white;border-radius:10px;transition:width .5s cubic-bezier(.34,1.56,.64,1);}
.hprog-label{color:rgba(255,255,255,.9);font-size:.72rem;font-weight:800;flex-shrink:0;}

/* ── BOTTOM TABS ── */
#tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:var(--tab-h);display:flex;background:var(--card);border-top:1.5px solid var(--border);z-index:200;padding-bottom:env(safe-area-inset-bottom,0px);}
.tab-btn{flex:1;padding:8px 4px 6px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:.58rem;font-weight:800;color:var(--muted2);border-top:3px solid transparent;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tab-btn.active{color:var(--lime);border-top-color:var(--lime);}
.tab-icon{font-size:.95rem;}
.tab-badge{background:var(--lime);color:white;border-radius:10px;padding:0 5px;font-size:.56rem;line-height:1.5;}

/* ── CARDS & INPUTS ── */
.card{background:var(--card);border-radius:14px;padding:12px 14px;border:1.5px solid var(--border);margin-bottom:8px;}
.lbl{font-size:.63rem;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:block;}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{
  background:var(--bg);border:1.5px solid var(--border2);border-radius:10px;
  padding:9px 12px;color:var(--text);font-size:.85rem;outline:none;width:100%;min-width:0;}
input:focus,select:focus,textarea:focus{border-color:var(--lime);background:var(--card);box-shadow:0 0 0 3px rgba(124,194,0,.12);}
.row{display:flex;gap:7px;align-items:stretch;flex-wrap:wrap;}
.row>input,.row>select{flex:1 1 80px;min-width:0;}
.mb8{margin-bottom:8px;}

/* ── BUTTONS ── */
.btn{background:linear-gradient(135deg,var(--lime),var(--lime2));color:white;border:none;border-radius:11px;padding:10px 16px;cursor:pointer;font-family:inherit;font-size:.84rem;font-weight:800;white-space:nowrap;flex-shrink:0;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.45;}
.btn-sm{background:var(--card);color:var(--lime);border:2px solid var(--lime);border-radius:9px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:.72rem;font-weight:800;white-space:nowrap;flex-shrink:0;}
.btn-ghost{background:var(--limebg);color:var(--text2);border:1.5px solid var(--border);border-radius:9px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:.72rem;font-weight:700;flex-shrink:0;}
.btn-full{width:100%;}
.btn-danger{color:var(--red)!important;border-color:var(--red)!important;background:var(--card)!important;}

/* ── TASK ITEMS (#66 swipe wrapper) ── */
.task-wrap{position:relative;overflow:hidden;border-radius:13px;margin-bottom:5px;}
/* 背景ヒント（スワイプ時に出る）*/
.swipe-hint-r{position:absolute;inset:0;display:flex;align-items:center;padding-left:18px;background:#dcf5b0;border-radius:13px;font-size:.8rem;font-weight:800;color:#3a6600;pointer-events:none;opacity:0;transition:opacity .1s;}
.swipe-hint-l{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;background:#ffe0e0;border-radius:13px;font-size:.8rem;font-weight:800;color:#aa1010;pointer-events:none;opacity:0;transition:opacity .1s;}
@media (prefers-color-scheme:dark){
  .swipe-hint-r{background:#1a3c00;color:#aaee44;}
  .swipe-hint-l{background:#3a0808;color:#ff8888;}
}
.task-item{
  display:flex;align-items:center;gap:9px;padding:10px 12px;
  background:var(--card);border:1.5px solid var(--border);border-radius:13px;
  transition:transform .1s,background .15s,border-color .15s;
  position:relative;z-index:1;
  touch-action:pan-y; /* スクロールは縦方向のみ許可 */
  will-change:transform;
}
.task-item.swiping{transition:none;}
.task-item.done{opacity:.42;background:var(--bg);}
.task-item.done .task-title{text-decoration:line-through;color:var(--muted2);}
.task-item.habit{border-style:dashed;}
/* #28 スキップ */
.task-item.skipped{opacity:.6;background:var(--skipbg);border-color:var(--skip);}
.task-item.skipped .task-title{color:var(--skip);}
/* #5 D&D */
.task-item.drag-over-top{border-top:2.5px solid var(--lime);}
.task-item.drag-over-bot{border-bottom:2.5px solid var(--lime);}
.task-item.dragging{opacity:.4;transform:scale(.98);}
.drag-handle{cursor:grab;color:var(--muted2);font-size:.85rem;padding:4px 3px;flex-shrink:0;touch-action:none;user-select:none;}
.drag-handle:active{cursor:grabbing;}

.task-check{width:28px;height:28px;border-radius:9px;border:2px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.88rem;color:white;font-weight:900;flex-shrink:0;transition:all .15s;}
.task-check.checked{background:linear-gradient(135deg,var(--lime),var(--lime2));border-color:var(--lime);animation:checkAnim .25s ease;}
.task-check.skipped{background:var(--skip);border-color:var(--skip);}
.task-body{flex:1;min-width:0;}
.task-title{font-size:.86rem;color:var(--text);font-weight:600;line-height:1.35;word-break:break-word;cursor:pointer;border-radius:6px;padding:2px 4px;margin:-2px -4px;}
.task-edit-input{font-size:.86rem;font-weight:600;border:1.5px solid var(--lime);border-radius:8px;padding:3px 8px;background:var(--card);color:var(--text);width:100%;outline:none;box-shadow:0 0 0 3px rgba(124,194,0,.15);}
.task-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;}
.task-tag{font-size:.62rem;background:var(--limebg);color:var(--muted);padding:1px 6px;border-radius:6px;font-weight:700;}
.task-time-tag{font-size:.62rem;background:#E8F4FF;color:var(--blue);padding:1px 6px;border-radius:6px;font-weight:700;}
.skip-tag{font-size:.62rem;background:var(--skipbg);color:var(--skip);padding:1px 6px;border-radius:6px;font-weight:700;}
@media (prefers-color-scheme:dark){.task-time-tag{background:#0a1830;color:#66aaff;}}
.task-del{background:none;border:none;cursor:pointer;color:var(--muted2);font-size:.88rem;padding:4px 5px;flex-shrink:0;}

/* ── SECTION TOGGLES ── */
.sec-toggle{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;cursor:pointer;user-select:none;position:relative;}
.sec-toggle::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:0 4px 4px 0;background:var(--sec-color,var(--lime));}
.sec-toggle-label{font-size:.85rem;font-weight:900;color:var(--text2);flex:1;min-width:0;}
.sec-badge{font-size:.66rem;color:white;background:var(--muted);padding:3px 9px;border-radius:20px;font-weight:800;flex-shrink:0;white-space:nowrap;}
.sec-badge.has-items{background:var(--lime);}
.sec-badge.all-done{background:#22AA55;}
.sec-progress{height:3px;background:var(--border);border-radius:3px;margin:0 14px 6px;overflow:hidden;}
.sec-progress-fill{height:100%;border-radius:3px;transition:width .4s ease;}

/* ── PLAN ITEMS ── */
.span-tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 12px 4px;}
.span-tab{flex:0 0 auto;padding:5px 12px;border-radius:20px;border:1.5px solid var(--border2);background:var(--card);font-size:.72rem;font-weight:800;color:var(--muted);cursor:pointer;white-space:nowrap;}
.span-tab.active{background:linear-gradient(135deg,var(--lime),var(--lime2));color:white;border-color:var(--lime);}
.plan-item{display:flex;align-items:flex-start;gap:9px;padding:11px 13px;background:var(--card);border:1.5px solid var(--border);border-radius:13px;margin-bottom:5px;}
.plan-check{width:26px;height:26px;border-radius:8px;border:2px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.82rem;color:white;font-weight:900;flex-shrink:0;margin-top:1px;}
.plan-check.checked{background:linear-gradient(135deg,var(--lime),var(--lime2));border-color:var(--lime);}
.plan-body{flex:1;min-width:0;}
.plan-title{font-size:.86rem;color:var(--text);font-weight:600;word-break:break-word;}
.plan-item.done .plan-title{text-decoration:line-through;color:var(--muted2);}
.plan-date{font-size:.66rem;color:var(--muted);margin-top:2px;}
.plan-del{background:none;border:none;cursor:pointer;color:var(--muted2);font-size:.88rem;padding:0 3px;}
.plan-overdue .plan-title{color:var(--red);}
.repeat-badge{background:#FFF0FF;color:#AA44CC;border-radius:8px;padding:1px 6px;font-size:.62rem;font-weight:700;}
@media (prefers-color-scheme:dark){.repeat-badge{background:#2a1040;color:#cc88ff;}}

/* ── PIN BANNER ── */
.pin-banner{background:linear-gradient(135deg,var(--lime),var(--lime2));border-radius:16px;padding:12px 14px;margin-bottom:8px;}
.pin-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.2);}
.pin-item:last-child{border-bottom:none;padding-bottom:0;}

/* ── BRIEFING ── */
.briefing-card{background:var(--card);border:1.5px solid var(--border2);border-radius:14px;padding:10px 13px;margin-bottom:8px;border-left:4px solid var(--lime);}
.briefing-text{font-size:.83rem;color:var(--text2);line-height:1.6;}

/* ── #23 体重トラッカー ── */
.tracker-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:10px 13px;margin-bottom:8px;}
.tracker-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer;user-select:none;}
.tracker-body{overflow:hidden;max-height:0;transition:max-height .3s ease;}
.tracker-body.open{max-height:260px;}
.tracker-input-row{display:flex;gap:7px;align-items:center;margin-bottom:8px;}
.tracker-unit-btn{background:var(--limebg);border:1.5px solid var(--border2);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:.72rem;font-weight:800;color:var(--muted);font-family:inherit;}
.tracker-unit-btn.active{background:var(--lime);color:white;border-color:var(--lime);}
.tracker-sparkline{width:100%;height:50px;display:block;margin:4px 0;}
.tracker-log{display:flex;flex-direction:column;gap:3px;max-height:90px;overflow-y:auto;}
.tracker-log-item{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;background:var(--bg);border-radius:8px;font-size:.78rem;}
.tracker-val{font-weight:800;color:var(--lime);}
.tracker-date{font-size:.66rem;color:var(--muted);}
.tracker-del{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:.78rem;}

/* ── CHAT ── */
#view-chat .chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
.chat-bubble{max-width:88%;border-radius:16px;padding:10px 13px;font-size:.84rem;line-height:1.6;word-break:break-word;}
.chat-bubble.user{background:linear-gradient(135deg,var(--lime),var(--lime2));color:white;align-self:flex-end;border-bottom-right-radius:4px;}
.chat-bubble.paru{background:var(--card);border:1.5px solid var(--border);color:var(--text2);align-self:flex-start;border-bottom-left-radius:4px;}
.chat-bubble.system{background:var(--limebg);border:1px dashed var(--border2);color:var(--muted);font-size:.76rem;align-self:center;text-align:center;max-width:100%;}
.chat-footer{display:flex;gap:7px;padding:10px 12px;background:var(--card);border-top:1.5px solid var(--border);flex-shrink:0;}
.chat-footer input{flex:1;min-width:0;}
.chat-typing{display:flex;gap:4px;align-items:center;padding:4px 2px;}
.chat-typing span{width:7px;height:7px;border-radius:50%;background:var(--muted2);animation:bounce .9s ease infinite;}
.chat-typing span:nth-child(2){animation-delay:.15s;}
.chat-typing span:nth-child(3){animation-delay:.3s;}
.chat-task-preview{background:var(--limebg);border:1.5px solid var(--border2);border-radius:12px;padding:10px 12px;margin-top:4px;}
.chat-task-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:.82rem;color:var(--text2);}
.chat-task-row:last-child{border-bottom:none;}

/* ── MISC ── */
.tip{font-size:.75rem;color:var(--muted2);background:var(--limebg);border-radius:9px;padding:8px 11px;line-height:1.6;margin-bottom:8px;}
.empty{text-align:center;padding:28px 0;color:var(--muted2);}
.empty em{font-size:2.2rem;display:block;margin-bottom:8px;font-style:normal;}
.pfolder{border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px;}
.pfolder-head{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:var(--limebg);cursor:pointer;}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;}
.pthumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:pointer;}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block;}
.pthumb.active{outline:3px solid var(--lime);outline-offset:1px;}
.pthumb-del{position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:50%;background:rgba(221,32,32,.85);border:none;cursor:pointer;color:white;font-size:.6rem;font-weight:900;display:flex;align-items:center;justify-content:center;}

/* ── 5タブ対応（フォントサイズ微調整） */
.tab-btn{flex:1;padding:7px 2px 5px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:.52rem;font-weight:800;color:var(--muted2);border-top:3px solid transparent;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:2px;}

/* ── リストタブ */
.list-tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 12px 6px;flex-shrink:0;scrollbar-width:none;}
.list-tabs::-webkit-scrollbar{display:none;}
.list-tab{flex:0 0 auto;padding:5px 12px;border-radius:20px;border:1.5px solid var(--border2);background:var(--card);font-size:.72rem;font-weight:800;color:var(--muted);cursor:pointer;white-space:nowrap;}
.list-tab.active{background:var(--lime);color:white;border-color:var(--lime);}
.list-item{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;margin-bottom:5px;}
.list-check{width:24px;height:24px;border-radius:7px;border:2px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.76rem;color:white;font-weight:900;flex-shrink:0;}
.list-check.checked{background:var(--lime);border-color:var(--lime);}
.list-text{flex:1;font-size:.85rem;color:var(--text);word-break:break-word;}
.list-item.done .list-text{text-decoration:line-through;color:var(--muted2);}
.list-del{background:none;border:none;cursor:pointer;color:var(--muted2);font-size:.85rem;padding:0 3px;}

/* ── ジャーナルタブ */
.journal-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:8px;}
.journal-date{font-size:.68rem;color:var(--muted);font-weight:800;}
.journal-body{font-size:.84rem;color:var(--text2);line-height:1.65;margin-top:4px;white-space:pre-wrap;word-break:break-word;}
.journal-tag{display:inline-block;font-size:.64rem;background:var(--limebg);color:var(--muted);padding:1px 7px;border-radius:6px;font-weight:700;margin-right:4px;}
.kpt-box{background:var(--bg);border:1.5px solid var(--border2);border-radius:10px;padding:8px 10px;margin-bottom:7px;}
.kpt-label{font-size:.66rem;font-weight:800;letter-spacing:.08em;margin-bottom:4px;}
.kpt-label.k{color:#22aa44;}
.kpt-label.p{color:var(--red);}
.kpt-label.t{color:var(--blue);}

/* ── 音声入力 */
#mic-btn{background:var(--limebg);border:1.5px solid var(--border2);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;flex-shrink:0;transition:background .15s;}
#mic-btn.listening{background:var(--red);border-color:var(--red);animation:pulse .8s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-color-scheme:dark){#mic-btn{background:var(--limebg);}}

/* FAB time-button chips */

<script>
// ══════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════
const PRAISES=["やりましたよ〜！えらいですよ⚾","ちゃんとできましたね！すごいですよ〜✨","わ〜！一緒に喜びますね🌸","さすがですよ！","…ちょっとだけえらいですよ（照）","続けることが大事ですよ〜！💪","えっ、もうやったんですか？はやいですよ！","ナイスプレーです⚾","一緒に頑張りましょうね🌸"];
const DEFAULT_HABITS=[

const SPAN_LABELS=[{id:"week",label:"今週"},{id:"month",label:"今月"},{id:"3m",label:"3ヶ月"},{id:"6m",label:"半年"},{id:"1y",label:"1年"},{id:"3y",label:"3年"},{id:"10y",label:"10年"}];
const TABS=[
  {id:"today",   icon:"✅",label:"今日"},
  {id:"plan",    icon:"📅",label:"予定"},
  {id:"chat",    icon:"💬",label:"相談"},

];
// リストカテゴリ

  {id:"buy_goods", label:"🛒 消耗品", icon:"🛒"},

const todayStr=()=>new Date().toISOString().slice(0,10);
const daysUntil=d=>Math.ceil((new Date(d+"T00:00:00")-new Date())/864e5);
const rand=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s??'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const $=id=>document.getElementById(id);

const S={
  get:k=>{try{const v=localStorage.getItem("paru_"+k);return v!=null?JSON.parse(v):null;}catch{return null;}},
  set:(k,v)=>{
    try{localStorage.setItem("paru_"+k,JSON.stringify(v));}catch(e){
      if(e.name==="QuotaExceededError"){
        toast("💾 ストレージ容量不足！不要なデータを削除するかGAS同期を設定してね","4000","error");
      }
    }
    if(typeof scheduleGASSync==="function") scheduleGASSync();
  }
};

function getSys(){
  const polite=localStorage.getItem("paru_polite")!=="false";
  const phrases=(S.get("paruPhrases")||[]).slice(0,10);
  const pn=phrases.length?"\n【口癖】\n"+phrases.map(p=>`「${p}」`).join(" "):"";
  const base=`あなたは日向坂46三期生・山口陽世（ぱる）をモデルにした個人秘書AIです。DeNAベイスターズ大好き⚾。
明るくポジティブ、アイドルらしくかわいく元気。ツンデレ：褒める時少し照れる。キツい言葉は絶対に使わない。
返答は短く2〜3文まで。絵文字を自然に使う。相手を全力で応援する。${pn}`;
  return base+"\n話し方："+(polite?"丁寧語（ですます）ベース。「〜ですよ！」「〜しましょう！」":"タメ口ベース。「〜だよ！」「すごい！えらい！」");
}

async function callAI(msg,loadMsg="考え中…✨"){
  const key=localStorage.getItem("paru_gemini_key")||"";
  if(!key){
    toast("設定タブでAPIキーを設定してね⚾","3000","info");
    return"⚾ 設定タブでAPIキーを設定してね！";
  }
  const model="gemini-2.0-flash"; // 全機能統一固定
  showLoad(loadMsg);
  // #99: AbortControllerでタイムアウト制御（15秒）
  const ctrl=new AbortController();
  const tOut=setTimeout(()=>ctrl.abort(),15000);
  try{
    const r=await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
      {method:"POST",headers:{"Content-Type":"application/json"},signal:ctrl.signal,
       body:JSON.stringify({system_instruction:{parts:[{text:getSys()}]},contents:[{role:"user",parts:[{text:msg}]}],generationConfig:{maxOutputTokens:500,temperature:0.9}})}
    );
    clearTimeout(tOut);
    const d=await r.json();
    hideLoad();
    // #36: HTTPステータス別エラーメッセージ
    if(d.error){
      const code=d.error.code||0;
      const detail=d.error.message||"";
      if(code===401||code===403)toast(`APIキーが無効か期限切れですよ（${code}）`,"4000","error");
      else if(code===429)toast("APIの呼び出し上限に達しました。少し待ってね","4000","error");
      else if(code>=500)toast(`Geminiサーバーエラー（${code}）。しばらく待ってね`,"4000","error");
      else toast(`エラー: ${detail.slice(0,60)}`,"4000","error");
      return`[Error ${code}] ${detail}`;
    }
    return d.candidates?.[0]?.content?.parts?.[0]?.text||"";
  }catch(e){
    clearTimeout(tOut);hideLoad();
    if(e.name==="AbortError"){
      toast("タイムアウトしました。ネット接続を確認してね","3500","error");
      return"タイムアウト…ネット接続を確認してね";
    }
    toast("通信エラー…ネット接続を確認してね","3000","error");
    return"通信エラー…ネット接続を確認してね";
  }
}

// #99: ローカルストレージ容量チェック
function checkStorageQuota(){
  try{
    const test="paru_quota_test";
    localStorage.setItem(test,"x".repeat(1000));
    localStorage.removeItem(test);
  }catch(e){
    toast("⚠️ ストレージ容量が不足しています。古いデータを削除してください","5000","error");
  }
}

let loadTimer=null;
function showLoad(msg="処理中…"){$("loading").style.display="flex";$("loading-msg").textContent=msg;loadTimer=setTimeout(hideLoad,20000);}
function hideLoad(){clearTimeout(loadTimer);$("loading").style.display="none";}

// ══════════════════════════════════════
// #30 トーストシステム（キュー式・種類別）
// ══════════════════════════════════════
const _toastTimers=new Map();
let _toastSeq=0;

function toast(msg,dur=2500,type="default"){
  const container=document.getElementById("toast-container");if(!container)return;
  const id="t"+(++_toastSeq);
  const el=document.createElement("div");
  el.className=`toast-item ${type}`;
  el.id=id;
  el.innerHTML=`<span>${esc(msg)}</span>`;
  container.appendChild(el);
  const timer=setTimeout(()=>{el.style.opacity="0";el.style.transform="translateY(8px)";setTimeout(()=>el.remove(),200);_toastTimers.delete(id);},dur);
  _toastTimers.set(id,timer);
}

function showUndoToast(msg){
  const container=document.getElementById("toast-container");if(!container)return;
  const id="t"+(++_toastSeq);
  const el=document.createElement("div");
  el.className="toast-item undo";
  el.id=id;
  el.innerHTML=`<span>${esc(msg)}</span><button class="toast-undo-btn" onclick="undoDelete()">元に戻す</button>`;
  container.appendChild(el);
  const timer=setTimeout(()=>{el.style.opacity="0";setTimeout(()=>{el.remove();lastDeleted=null;},200);_toastTimers.delete(id);},5000);
  _toastTimers.set(id,timer);
  el.querySelector(".toast-undo-btn").addEventListener("click",()=>{clearTimeout(timer);_toastTimers.delete(id);el.remove();});
}
let lastDeleted=null;
function undoDelete(){
  if(!lastDeleted)return;
  if(lastDeleted.type==="task"){tasks.push(lastDeleted.item);saveTasks();buildTabs();updateHeader();renderToday();}
  else if(lastDeleted.type==="plan"){plans.push(lastDeleted.item);savePlans();renderPlan();}
  lastDeleted=null;toast("元に戻しましたよ✨","2000","success");
}

// ══════════════════════════════════════
// #68/#69 カスタムモーダル（confirm/prompt全廃）
// ══════════════════════════════════════
function showConfirm(msg,onOk,onCancel){
  _removeModal();
  const el=document.createElement("div");
  el.id="_modal_overlay";
  el.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:4000;display:flex;align-items:center;justify-content:center;padding:24px;";
  el.onclick=e=>{if(e.target===el){_removeModal();onCancel&&onCancel();}};
  el.innerHTML=`<div style="background:var(--card);border-radius:18px;padding:22px 20px;width:100%;max-width:340px;text-align:center;" onclick="event.stopPropagation()">
    <div style="font-size:.9rem;font-weight:800;color:var(--text2);line-height:1.6;margin-bottom:18px">${esc(msg)}</div>
    <div style="display:flex;gap:10px;">
      <button id="_modal_cancel" style="flex:1;background:var(--limebg);color:var(--muted);border:1.5px solid var(--border);border-radius:11px;padding:11px;font-size:.84rem;font-weight:700;cursor:pointer;font-family:inherit">キャンセル</button>
      <button id="_modal_ok" style="flex:1;background:var(--red);color:white;border:none;border-radius:11px;padding:11px;font-size:.84rem;font-weight:800;cursor:pointer;font-family:inherit">OK</button>
    </div>
  </div>`;
  el.querySelector("#_modal_ok").onclick=()=>{_removeModal();onOk&&onOk();};
  el.querySelector("#_modal_cancel").onclick=()=>{_removeModal();onCancel&&onCancel();};
  document.body.appendChild(el);
  setTimeout(()=>el.querySelector("#_modal_ok")?.focus(),50);
}

function showPrompt(msg,defaultVal,onOk,onCancel){
  _removeModal();
  const el=document.createElement("div");
  el.id="_modal_overlay";
  el.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:4000;display:flex;align-items:center;justify-content:center;padding:24px;";
  el.onclick=e=>{if(e.target===el){_removeModal();onCancel&&onCancel();}};
  el.innerHTML=`<div style="background:var(--card);border-radius:18px;padding:22px 20px;width:100%;max-width:340px;" onclick="event.stopPropagation()">
    <div style="font-size:.88rem;font-weight:800;color:var(--text2);margin-bottom:12px">${esc(msg)}</div>
    <input type="text" id="_modal_input" value="${esc(defaultVal||"")}"
      style="width:100%;background:var(--bg);border:1.5px solid var(--border2);border-radius:10px;padding:9px 12px;font-size:.86rem;outline:none;color:var(--text);margin-bottom:14px;"
      enterkeyhint="done">
    <div style="display:flex;gap:10px;">
      <button id="_modal_cancel" style="flex:1;background:var(--limebg);color:var(--muted);border:1.5px solid var(--border);border-radius:11px;padding:11px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit">キャンセル</button>
      <button id="_modal_ok" style="flex:1;background:linear-gradient(135deg,var(--lime),var(--lime2));color:white;border:none;border-radius:11px;padding:11px;font-size:.84rem;font-weight:800;cursor:pointer;font-family:inherit">OK</button>
    </div>
  </div>`;
  const inp=el.querySelector("#_modal_input");
  el.querySelector("#_modal_ok").onclick=()=>{const v=inp.value;_removeModal();onOk&&onOk(v);};
  el.querySelector("#_modal_cancel").onclick=()=>{_removeModal();onCancel&&onCancel();};
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();el.querySelector("#_modal_ok")?.click();}if(e.key==="Escape"){_removeModal();onCancel&&onCancel();}};
  document.body.appendChild(el);
  setTimeout(()=>{inp.focus();inp.select();},80);
}

function _removeModal(){document.getElementById("_modal_overlay")?.remove();}

// 同期するキー一覧（写真はIndexedDBなので除外）
const SYNC_KEYS=["tasks","plans","habits","streak","moodLog","journals",
  "taskTemplates","notifTimes","pinnedIds","hideDone","paruMsg",
  "lastBriefingDate","weeklyReport","monthlyReport","last_date",
  "trackerOpen","weightLog","activeUnit","targetWeight","shutdownDone",
  "chatHistory","custom_lists","paruPhrases","journalTab"];

function _getAllData(){
  const data={};
  SYNC_KEYS.forEach(k=>{const v=S.get(k);if(v!==null)data[k]=v;});
  data["polite"]=localStorage.getItem("paru_polite")||"true";
  data["_v"]=Date.now();
  return data;
}

function _applyData(data){
  if(!data||typeof data!=="object")return;
  SYNC_KEYS.forEach(k=>{
    if(data[k]!==undefined){
      try{localStorage.setItem("paru_"+k,JSON.stringify(data[k]));}catch{}
    }
  });
  if(data["polite"]!==undefined)localStorage.setItem("paru_polite",data["polite"]);
  // ステート変数を再ロード
  tasks=S.get("tasks")||[];
  plans=S.get("plans")||[];
  habits=S.get("habits")||DEFAULT_HABITS;
  streak=S.get("streak")||0;
  moodLog=S.get("moodLog")||[];
  journals=S.get("journals")||[];
  taskTemplates=S.get("taskTemplates")||[];
  const nt=S.get("notifTimes");if(nt)notifTimes=nt;
  pinnedIds=S.get("pinnedIds")||[];
  hideDone=S.get("hideDone")||false;
  paruMsg=S.get("paruMsg")||"";
  weightLog=S.get("weightLog")||[];
  chatHistory=S.get("chatHistory")||[];
}

async function syncFromGAS(){
  if(!gasUrl||isSyncing)return;
  isSyncing=true;_showSyncStatus("syncing");
  try{
    const res=await fetch(gasUrl,{method:"GET",cache:"no-cache"});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    if(data.error)throw new Error(data.error);
    const localV=parseInt(S.get("_syncV")||"0");
    const gasV=data._v||0;
    if(gasV>localV){
      _applyData(data);
      S.get("_syncV"); // don't retrigger sync
      try{localStorage.setItem("paru__syncV",JSON.stringify(gasV));}catch{}
      updateHeader();buildTabs();
      ({today:renderToday,plan:renderPlan,settings:renderSettings})[currentTab]?.();
      toast("☁️ クラウドから最新データを取得しましたよ","2500","info");
    }
    _showSyncStatus("ok");
  }catch(e){
    console.warn("GAS pull failed:",e);
    _showSyncStatus("error");
  }
  isSyncing=false;
}

async function syncToGAS(){
  if(!gasUrl||isSyncing)return;
  isSyncing=true;_showSyncStatus("syncing");
  try{
    const data=_getAllData();
    try{localStorage.setItem("paru__syncV",JSON.stringify(data._v));}catch{}
    const res=await fetch(gasUrl,{method:"POST",body:JSON.stringify(data)});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const result=await res.json();
    if(result.error)throw new Error(result.error);
    if(result.reason==="stale"){
      // サーバーの方が新しい → pullして再試行
      isSyncing=false;
      await syncFromGAS();
      return;
    }
    _showSyncStatus("ok");
    toast("☁️ クラウドに保存しましたよ","1800","success");
  }catch(e){
    console.warn("GAS push failed:",e);
    _showSyncStatus("error");
    toast("⚠️ クラウド同期エラー。ネット接続を確認してね","3000","error");
  }
  isSyncing=false;
}

function scheduleGASSync(){
  if(!gasUrl)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncToGAS,3000);
}

function _showSyncStatus(st){
  syncStatus=st;
  const el=document.getElementById("sync-indicator");
  if(!el)return;
  const map={
    idle:  ["☁️","未設定","var(--muted)"],
    syncing:["🔄","同期中…","var(--blue)"],
    ok:    ["✅","同期済み","var(--lime)"],
    error: ["⚠️","エラー","var(--red)"]
  };
  const [ic,lb,co]=map[st]||map.idle;
  el.innerHTML=`<span style="font-size:.7rem;font-weight:800;color:${co}">${ic} ${lb}</span>`;
}

function saveGasUrl(){
  const v=document.getElementById("gas-url-input")?.value?.trim();
  gasUrl=v||"";

// ══════════════════════════════════════
// 🔊 音声読み上げ (speechSynthesis)
// ══════════════════════════════════════
let isSpeaking=false;
let speakUtterance=null;

function speakText(text){
  if(!("speechSynthesis" in window)){
    toast("このブラウザは音声読み上げに対応していません","2500","error");return;
  }
  if(isSpeaking){
    window.speechSynthesis.cancel();
    isSpeaking=false;
    _updateSpeakBtn(false);
    return;
  }
  // 絵文字・記号を除去して読み上げしやすいテキストに
  const clean=text.replace(/[⚾🌸✨💪😊🙂😐😔😤🌅☀️🌙📋📅📆🗓📌🔔💊🍳📓💪🪥🍱😴🚶🍽️🛁]/g,"")
                   .replace(/[^\u0000-\u007F\u3000-\u9FFF\u30A0-\u30FF\u3040-\u309F]/g,"")
                   .trim();
  if(!clean){toast("読み上げるテキストがありません","1800","info");return;}

  speakUtterance=new SpeechSynthesisUtterance(clean);
  speakUtterance.lang="ja-JP";
  speakUtterance.rate=1.0;
  speakUtterance.pitch=1.1;
  speakUtterance.volume=1.0;

  // 日本語音声を優先選択
  const voices=window.speechSynthesis.getVoices();
  const jaVoice=voices.find(v=>v.lang==="ja-JP"&&v.localService)||
                voices.find(v=>v.lang==="ja-JP")||
                voices.find(v=>v.lang.startsWith("ja"));
  if(jaVoice)speakUtterance.voice=jaVoice;

  speakUtterance.onstart=()=>{isSpeaking=true;_updateSpeakBtn(true);};
  speakUtterance.onend=()=>{isSpeaking=false;_updateSpeakBtn(false);};
  speakUtterance.onerror=()=>{isSpeaking=false;_updateSpeakBtn(false);};

  window.speechSynthesis.cancel(); // 前の発話をキャンセル
  window.speechSynthesis.speak(speakUtterance);
}

function _updateSpeakBtn(speaking){
  const btn=document.getElementById("speak-btn");
  if(!btn)return;
  btn.textContent=speaking?"⏹ 停止":"🔊 読み上げ";
  btn.style.color=speaking?"var(--red)":"var(--blue)";
}

// DOM直接更新ヘルパー (#29/#94)
function _updateTaskItemDOM(id,t){
  const wrap=document.getElementById("w-"+id);
  const el=document.getElementById("ti-"+id);
  if(!el||!wrap)return;

  // クラス更新
  el.classList.toggle("done",!!t.done);
  el.classList.toggle("skipped",!!t.skipped);

  // チェックボックス更新
  const check=el.querySelector(".task-check");
  if(check){
    check.classList.toggle("checked",!!t.done);
    check.classList.toggle("skipped",!!t.skipped);
    check.textContent=t.done?"✓":t.skipped?"−":"";
  }

  // メタ更新（スキップバッジ）
  const meta=el.querySelector(".task-meta");
  if(meta){
    const oldSkip=meta.querySelector(".skip-tag");
    if(t.skipped&&!oldSkip){
      const s=document.createElement("span");s.className="skip-tag";s.textContent="スキップ";meta.appendChild(s);
    }else if(!t.skipped&&oldSkip){oldSkip.remove();}
  }

  // 完了非表示モード
  if(hideDone&&t.done){wrap.style.display="none";}
  else{wrap.style.display="";}
}

function delTask(id){

// #66 スワイプジェスチャー
// ══════════════════════════════════════
function attachSwipe(wrapEl,taskId,isPlan=false){
  const itemEl=wrapEl.querySelector(".task-item");
  const hintR=wrapEl.querySelector(".swipe-hint-r");
  const hintL=wrapEl.querySelector(".swipe-hint-l");
  if(!itemEl)return;

  let startX=0,startY=0,curX=0,active=false,swiping=false;
  const THRESHOLD=72; // px

  itemEl.addEventListener("touchstart",e=>{
    startX=e.touches[0].clientX;startY=e.touches[0].clientY;curX=0;active=true;swiping=false;
  },{passive:true});

  itemEl.addEventListener("touchmove",e=>{
    if(!active)return;
    const dx=e.touches[0].clientX-startX;
    const dy=e.touches[0].clientY-startY;
    if(!swiping&&Math.abs(dy)>Math.abs(dx))return; // 縦スクロールを優先
    if(Math.abs(dx)>10){swiping=true;}
    if(!swiping)return;
    curX=dx;
    itemEl.classList.add("swiping");
    itemEl.style.transform=`translateX(${dx}px)`;
    const ratio=Math.min(Math.abs(dx)/THRESHOLD,1);
    if(dx>0){hintR.style.opacity=ratio*.85;hintL.style.opacity=0;}
    else{hintL.style.opacity=ratio*.85;hintR.style.opacity=0;}
  },{passive:true});

  itemEl.addEventListener("touchend",()=>{
    if(!swiping){active=false;return;}
    itemEl.classList.remove("swiping");
    itemEl.style.transform="";
    hintR.style.opacity=0;hintL.style.opacity=0;
    active=false;
    if(curX>THRESHOLD){
      // 右スワイプ → 完了
      itemEl.classList.add("task-fading");
      setTimeout(()=>{
        if(isPlan)togglePlan(taskId);else toggleTask(taskId);
      },350);
    }else if(curX<-THRESHOLD){
      // 左スワイプ → 削除
      if(isPlan)delPlan(taskId);else delTask(taskId);
    }else{
      // 戻す
    }
  });
}

// #5 ドラッグ＆ドロップ並び替え
// ══════════════════════════════════════
let dragState=null;

function attachDrag(wrapEl,taskId){
  const handle=wrapEl.querySelector(".drag-handle");
  const itemEl=wrapEl.querySelector(".task-item");
  if(!handle||!itemEl)return;

  handle.addEventListener("pointerdown",e=>{
    e.stopPropagation();
    dragState={id:taskId,originEl:wrapEl,startY:e.clientY};
    wrapEl.classList.add("dragging");
    handle.setPointerCapture(e.pointerId);
  });

  handle.addEventListener("pointermove",e=>{
    if(!dragState||dragState.id!==taskId)return;
    const dy=e.clientY-dragState.startY;
    wrapEl.style.transform=`translateY(${dy}px)`;

    // 他の要素との当たり判定
    const all=[...document.querySelectorAll(".task-wrap:not(.dragging)")];
    all.forEach(el=>el.classList.remove("drag-over-top","drag-over-bot"));
    const target=all.find(el=>{
      const r=el.getBoundingClientRect();
      return e.clientY>r.top&&e.clientY<r.bottom;
    });
    if(target){
      const r=target.getBoundingClientRect();
      const mid=r.top+r.height/2;
      target.classList.add(e.clientY<mid?"drag-over-top":"drag-over-bot");
      dragState.target=target;
      dragState.insertBefore=(e.clientY<mid);
    }else{dragState.target=null;}
  });

  handle.addEventListener("pointerup",e=>{
    if(!dragState||dragState.id!==taskId)return;
    wrapEl.classList.remove("dragging");
    wrapEl.style.transform="";
    document.querySelectorAll(".drag-over-top,.drag-over-bot").forEach(el=>el.classList.remove("drag-over-top","drag-over-bot"));

    if(dragState.target){
      const rawId=dragState.target.id.replace("w-","");
      const targetId=parseFloat(rawId); // floatIDに対応（parseIntだと切り捨てで一致しない）
      const fromIdx=tasks.findIndex(t=>t.id===taskId);
      let toIdx=tasks.findIndex(t=>t.id===targetId);
      if(fromIdx!==-1&&toIdx!==-1&&fromIdx!==toIdx){
        const [moved]=tasks.splice(fromIdx,1);
        toIdx=tasks.findIndex(t=>t.id===targetId);
        const ins=dragState.insertBefore?toIdx:toIdx+1;
        tasks.splice(ins,0,moved);
        saveTasks();renderToday();
      }
    }
    dragState=null;
  });
}

// HELPERS
// ══════════════════════════════════════
function weekRange(){
  const d=new Date();d.setHours(0,0,0,0);
  const start=d.toISOString().slice(0,10);const end=new Date(d);end.setDate(d.getDate()+6);
  return{start,end:end.toISOString().slice(0,10)};
}
function monthRange(){
  const d=new Date();
  const start=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`;
  const last=new Date(d.getFullYear(),d.getMonth()+1,0);
  return{start,end:last.toISOString().slice(0,10)};
}
function inRange(date,start,end){return date>=start&&date<=end;}
function plansForSection(sec){
  const td=todayStr(),wr=weekRange(),mr=monthRange();
  return plans.filter(p=>{
    if(!p.dueDate||p.done)return false;
    if(sec==="today")return p.dueDate===td;
    if(sec==="week")return inRange(p.dueDate,wr.start,wr.end)&&p.dueDate!==td;
    if(sec==="month")return inRange(p.dueDate,mr.start,mr.end)&&!inRange(p.dueDate,wr.start,wr.end)&&p.dueDate!==td;
    return false;
  });
}

function logTracker(){
  const val=parseFloat($("track-val")?.value);
  if(isNaN(val)||val<=0){toast("数値を入力してね");return;}
  const entry={id:Date.now().toString(),date:todayStr(),value:val,unit:activeUnit};
  weightLog.push(entry);S.set("weightLog",weightLog);
  if($("track-val"))$("track-val").value="";

  // スパークライン描画
  renderToday();
  setTimeout(()=>drawSparklineOnCanvas(),50);

  if(activeUnit==="kg"&&targetWeight!=null){
    const diff=+(val-targetWeight).toFixed(1);
    toast(diff<=0?"🎉 目標体重達成！すごいですよ！":"体重 "+val+"kg を記録したよ📊 あと"+diff+"kgですよ！",3000);
  }else{
    toast(val+" "+activeUnit+" を記録したよ📊");
  }
}

function delTrackerEntry(id){
  weightLog=weightLog.filter(e=>e.id!==id);S.set("weightLog",weightLog);renderToday();
}

function saveTargetWeight(){
  const v=parseFloat($("target-w")?.value);
  if(isNaN(v)){targetWeight=null;S.set("targetWeight",null);toast("目標体重をクリアしました");}
  else{targetWeight=v;S.set("targetWeight",v);toast(`目標体重を${v}kgに設定したよ✨`);}
  renderToday();
}

function drawSparkline(data,unit){
  if(data.length<2)return null;
  return true; // placeholder - drawn post-render
}

function drawSparklineOnCanvas(){
  const canvas=$("sparkline-canvas");if(!canvas)return;
  const recent=weightLog.filter(e=>e.unit===activeUnit).slice(-14);
  if(recent.length<2){return;}
  const ctx=canvas.getContext("2d");
  const W=canvas.offsetWidth||300;const H=50;
  canvas.width=W*window.devicePixelRatio;canvas.height=H*window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  ctx.clearRect(0,0,W,H);
  const vals=recent.map(e=>e.value);
  const min=Math.min(...vals),max=Math.max(...vals);
  const range=max-min||1;
  const pts=recent.map((e,i)=>({
    x:i/(recent.length-1)*(W-8)+4,
    y:H-4-((e.value-min)/range*(H-12))
  }));
  // 塗りつぶし
  ctx.beginPath();ctx.moveTo(pts[0].x,H);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts[pts.length-1].x,H);ctx.closePath();
  ctx.fillStyle="rgba(124,194,0,.12)";ctx.fill();
  // ライン
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.strokeStyle="#7CC200";ctx.lineWidth=2;ctx.lineJoin="round";ctx.stroke();
  // ドット（最新のみ）
  const last=pts[pts.length-1];
  ctx.beginPath();ctx.arc(last.x,last.y,3,0,Math.PI*2);
  ctx.fillStyle="#7CC200";ctx.fill();
  // 目標ライン
  if(activeUnit==="kg"&&targetWeight!=null&&targetWeight>=min&&targetWeight<=max){
    const ty=H-4-((targetWeight-min)/range*(H-12));
    ctx.beginPath();ctx.moveTo(4,ty);ctx.lineTo(W-4,ty);
    ctx.strokeStyle="rgba(255,68,136,.6)";ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([]);
  }
}

function toggleMic(){
  if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){
    toast("このブラウザは音声入力に対応していません","3000","error");return;
  }
  if(micListening){
    micRecognition?.stop();
    return;
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  micRecognition=new SR();
  micRecognition.lang="ja-JP";
  micRecognition.interimResults=false;
  micRecognition.maxAlternatives=1;

  micRecognition.onstart=()=>{
    micListening=true;
    const btn=$("mic-btn");if(btn){btn.classList.add("listening");btn.textContent="🔴";}
    toast("聞いてますよ…話しかけてください🎤","2000","info");
  };
  micRecognition.onresult=(e)=>{
    const transcript=e.results[0][0].transcript;
    const inp=$("fab-input");
    if(inp)inp.value=transcript;
    toast(`「${transcript}」を認識しましたよ✨`,"2500","success");
  };
  micRecognition.onerror=(e)=>{
    toast(`音声認識エラー: ${e.error}`,"3000","error");
  };
  micRecognition.onend=()=>{
    micListening=false;
    const btn=$("mic-btn");if(btn){btn.classList.remove("listening");btn.textContent="🎤";}
  };
  micRecognition.start();
}

const saveLists=()=>S.set("lists",lists);

function getListTypes(){
  const custom=S.get("custom_lists")||[];
  return [...DEFAULT_LIST_TYPES,...custom];
}

function addListItem(text,type){
  if(!text?.trim())return;
  lists.push({id:Date.now(),type,text:text.trim(),done:false,created:todayStr()});
  saveLists();renderList();
}
function toggleList(id){
  lists=lists.map(l=>l.id===id?{...l,done:!l.done}:l);
  saveLists();renderList();
}
function delList(id){
  lists=lists.filter(l=>l.id!==id);
  saveLists();renderList();
}
function clearDoneLists(){
  showConfirm("完了済みをすべて削除しますか？",()=>{
    lists=lists.filter(l=>!(l.done&&l.type===currentList));
    saveLists();renderList();toast("完了済みを削除したよ");
  });
}

function addCustomListType(){
  showPrompt("カテゴリ名を入力（例：やりたいこと）","",name=>{
    if(!name?.trim())return;
    showPrompt("絵文字を1つ入力（例：🌟）","📋",emoji=>{
      const icon=(emoji||"📋").trim().slice(0,2)||"📋";
      const id="custom_"+Date.now();
      const custom=S.get("custom_lists")||[];
      custom.push({id,label:icon+" "+name.trim(),icon});
      S.set("custom_lists",custom);
      currentList=id;renderList();
      toast(name+"カテゴリを追加しましたよ🌸");
    });
  });
}

function delCustomListType(id){
  showConfirm("このカテゴリを削除しますか？（中のアイテムも削除されます）",()=>{
    const custom=(S.get("custom_lists")||[]).filter(c=>c.id!==id);
    S.set("custom_lists",custom);
    lists=lists.filter(l=>l.type!==id);saveLists();
    currentList=DEFAULT_LIST_TYPES[0]?.id||"buy_manga";
    renderList();
  });
}

function renderList(){
  const v=$("view-list");if(!v)return;
  const LIST_TYPES=getListTypes();
  if(!LIST_TYPES.find(t=>t.id===currentList))currentList=LIST_TYPES[0]?.id||"buy_manga";
  const cur=LIST_TYPES.find(t=>t.id===currentList);
  const isCustom=cur?.id?.startsWith("custom_");
  const items=lists.filter(l=>l.type===currentList);
  const pending=items.filter(l=>!l.done);
  const done=items.filter(l=>l.done);

  const tabHtml=LIST_TYPES.map(t=>`
    <button class="list-tab${currentList===t.id?" active":""}" onclick="currentList='${t.id}';renderList()">${t.label}</button>
  `).join("")+`<button class="list-tab" onclick="addCustomListType()" style="border-style:dashed;opacity:.7">＋</button>`;

  const itemHtml=l=>`<div class="list-item${l.done?" done":""}">
    <button class="list-check${l.done?" checked":""}" onclick="toggleList(${l.id})">${l.done?"✓":""}</button>
    <span class="list-text">${esc(l.text)}</span>
    <button class="list-del" onclick="delList(${l.id})">✕</button>
  </div>`;

  v.innerHTML=`
<div class="list-tabs">${tabHtml}</div>
<div style="padding:4px 12px 0">
  ${isCustom?`<div style="display:flex;justify-content:flex-end;margin-bottom:6px">
    <button class="btn-ghost" style="font-size:.68rem;color:var(--red);border-color:var(--red)" onclick="delCustomListType('${cur.id}')">このカテゴリを削除</button>
  </div>`:""}
  <div class="row mb8">
    <input type="text" id="list-input" placeholder="${cur?.icon||"📋"} ${(cur?.label||"").replace(/^.{1,2}\s/,"")}を追加…"
      onkeydown="if(event.key==='Enter'&&this.value.trim()){addListItem(this.value.trim(),currentList);this.value='';}">
    <button class="btn" onclick="const i=$('list-input');addListItem(i.value,currentList);i.value=''">＋</button>
  </div>
  ${!pending.length&&!done.length?`<div class="empty"><em>${cur?.icon||"📋"}</em>まだ何もないですよ</div>`:""}
  ${pending.map(itemHtml).join("")}
  ${done.length?`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 2px;margin-top:4px">
      <span style="font-size:.72rem;color:var(--muted)">✅ 完了済み ${done.length}件</span>
      <button class="btn-ghost" style="font-size:.68rem;color:var(--red);border-color:var(--red)" onclick="clearDoneLists()">全削除</button>
    </div>
    ${done.map(itemHtml).join("")}
  `:""}
</div>
<div style="height:80px"></div>`;
}

function parsePlanInput(raw){
  const text=raw.trim();const today=new Date();today.setHours(0,0,0,0);
  const pad=n=>String(n).padStart(2,"0");const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  let dueDate="",span="month",title=text;
  const dow=today.getDay(); // 0=日

  const rules=[
    // ── 今日・明日
    [/^(今日中に?|今日まで[にの]?)\s*(.+)/,(m)=>({date:fmt(today),span:"week",title:m[2]})],
    [/^明日まで[にの]?\s*(.+)/,(m)=>{const d=new Date(today);d.setDate(d.getDate()+1);return{date:fmt(d),span:"week",title:m[1]};}],
    // ── 今週・来週
    [/^(今週中に?|今週まで[にの]?)\s*(.+)/,(m)=>{const d=new Date(today);d.setDate(d.getDate()+(7-dow)||7);return{date:fmt(d),span:"week",title:m[2]};}],
    [/^週末まで[にの]?\s*(.+)/,(m)=>{const d=new Date(today);const diff=(6-dow+7)%7||7;d.setDate(d.getDate()+diff);return{date:fmt(d),span:"week",title:m[1]};}],
    [/^(来週中に?|来週まで[にの]?|来週末まで[にの]?)\s*(.+)/,(m)=>{const d=new Date(today);d.setDate(d.getDate()+(7-dow+7)%7||7);return{date:fmt(d),span:"week",title:m[2]};}],
    // ── 曜日指定「次の月曜」「今週の金曜」
    [/^(今週の?|次の?)(月|火|水|木|金|土|日)曜[日]?[まにの]*\s*(.+)/,(m)=>{
      const wdMap={月:1,火:2,水:3,木:4,金:5,土:6,日:0};const wd=wdMap[m[2]];
      const d=new Date(today);const diff=(wd-dow+7)%7||7;d.setDate(d.getDate()+diff);
      return{date:fmt(d),span:"week",title:m[3]};
    }],
    // ── 今月・来月
    [/^(今月中に?|今月末まで[にの]?)\s*(.+)/,(m)=>{const d=new Date(today.getFullYear(),today.getMonth()+1,0);return{date:fmt(d),span:"month",title:m[2]};}],
    [/^(来月中に?|来月末?まで[にの]?)\s*(.+)/,(m)=>{const d=new Date(today.getFullYear(),today.getMonth()+2,0);return{date:fmt(d),span:"month",title:m[2]};}],
    // ── N日後
    [/^(\d+)日(後|以内)[まにの]*\s*(.+)/,(m)=>{const d=new Date(today);d.setDate(d.getDate()+parseInt(m[1]));const n=parseInt(m[1]);const s=n<=7?"week":n<=31?"month":"3m";return{date:fmt(d),span:s,title:m[3]};}],
    // ── N週間後
    [/^(\d+)週間?(後|以内)[まにの]*\s*(.+)/,(m)=>{const d=new Date(today);d.setDate(d.getDate()+parseInt(m[1])*7);const n=parseInt(m[1]);const s=n<=1?"week":"month";return{date:fmt(d),span:s,title:m[3]};}],
    // ── Nヶ月後
    [/^(\d+)[ヶか]月(後|以内|まで[にの]?)\s*(.+)/,(m)=>{const d=new Date(today);d.setMonth(d.getMonth()+parseInt(m[1]));const n=parseInt(m[1]);const s=n<=1?"month":n<=3?"3m":n<=6?"6m":"1y";return{date:fmt(d),span:s,title:m[3]};}],
    // ── 半年
    [/^半年(後|以内|まで[にの]?)?\s*(.+)/,(m)=>{const d=new Date(today);d.setMonth(d.getMonth()+6);return{date:fmt(d),span:"6m",title:m[2]||text.replace(/半年(後|以内|まで[にの]?)?\s*/,"")};}],
    // ── 年内・年末
    [/^年(内|末)(まで[にの]?)?\s*(.+)/,(m)=>{const d=new Date(today.getFullYear(),11,31);return{date:fmt(d),span:"1y",title:m[3]};}],
    // ── 年明け・来年
    [/^(年明け|来年(初め?|頭)?)(まで[にの]?)?\s*(.+)/,(m)=>{const d=new Date(today.getFullYear()+1,0,15);return{date:fmt(d),span:"1y",title:m[4]};}],
    // ── Nヶ月後 / N年後 / 1年後
    [/^(一年|1年)(後|以内|まで[にの]?)?\s*(.+)/,(m)=>{const d=new Date(today);d.setFullYear(d.getFullYear()+1);return{date:fmt(d),span:"1y",title:m[3]};}],
    [/^(\d+)年(後|以内|まで[にの]?)\s*(.+)/,(m)=>{const d=new Date(today);d.setFullYear(d.getFullYear()+parseInt(m[1]));const n=parseInt(m[1]);const s=n<=1?"1y":n<=3?"3y":"10y";return{date:fmt(d),span:s,title:m[3]};}],
    // ── M月D日
    [/^(\d{1,2})月(\d{1,2})日(まで[にの]?|に|まで)?\s*(.+)/,(m)=>{
      const yr=today.getFullYear()+(today.getMonth()+1>parseInt(m[1])?1:0);
      const d=new Date(yr,parseInt(m[1])-1,parseInt(m[2]));
      const diff=(d-today)/864e5;
      const s=diff<=7?"week":diff<=31?"month":diff<=90?"3m":diff<=180?"6m":"1y";
      return{date:fmt(d),span:s,title:m[4]};
    }],
    // ── YYYY年M月D日
    [/^(\d{4})年(\d{1,2})月(\d{1,2})日[まにの]*\s*(.+)/,(m)=>{
      const d=new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]));
      const diff=(d-today)/864e5;
      const s=diff<=31?"month":diff<=180?"6m":diff<=365?"1y":diff<=365*3?"3y":"10y";
      return{date:fmt(d),span:s,title:m[4]};
    }],
  ];

  for(const [re,fn] of rules){
    const m=text.match(re);
    if(m){
      const res=fn(m);
      dueDate=res.date||dueDate;span=res.span||span;
      title=res.title||text;
      break;
    }
  }

  // スパン自動調整（日付があれば差分から再計算）
  if(dueDate){
    const diff=(new Date(dueDate)-today)/864e5;
    if(diff<=7)span="week";
    else if(diff<=31)span="month";
    else if(diff<=90)span="3m";
    else if(diff<=180)span="6m";
    else if(diff<=365)span="1y";
    else if(diff<=365*3)span="3y";
    else span="10y";
  }

  return{title:title.trim()||text,dueDate,span};
}

// ── ミニカレンダービルダー
let calViewYear=new Date().getFullYear();
let calViewMonth=new Date().getMonth();
function buildMiniCalendar(){
  const yr=calViewYear, mo=calViewMonth;
  const firstDay=new Date(yr,mo,1).getDay();
  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const today=todayStr();
  const pad=n=>String(n).padStart(2,"0");
  // 当月の予定をまとめる
  const planDates={};
  plans.filter(p=>p.dueDate&&p.dueDate.startsWith(`${yr}-${pad(mo+1)}`)).forEach(p=>{
    if(!planDates[p.dueDate])planDates[p.dueDate]=[];
    planDates[p.dueDate].push(p);
  });
  const DOW=["日","月","火","水","木","金","土"];
  let cells="";
  for(let i=0;i<firstDay;i++)cells+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${yr}-${pad(mo+1)}-${pad(d)}`;
    const ps=planDates[ds]||[];
    const isToday=ds===today;
    const hasPlan=ps.length>0;
    const dow=(firstDay+d-1)%7;
    cells+=`<div onclick="calDayClick('${ds}')" style="
      cursor:pointer;min-height:34px;padding:3px 1px 2px;
      background:${isToday?'var(--lime)':hasPlan?'var(--limebg)':'transparent'};
      border-radius:8px;border:1.5px solid ${isToday?'var(--lime2)':hasPlan?'var(--border2)':'transparent'};
      display:flex;flex-direction:column;align-items:center;transition:.1s">
      <span style="font-size:.76rem;font-weight:${isToday||hasPlan?'800':'500'};line-height:1.4;color:${isToday?'white':dow===0?'var(--red)':dow===6?'var(--blue)':'var(--text)'}">${d}</span>
      ${hasPlan?`<div style="display:flex;gap:1px;flex-wrap:wrap;justify-content:center">
        ${ps.slice(0,4).map(p=>`<div style="width:5px;height:5px;border-radius:50%;background:${p.done?'var(--muted2)':'var(--lime)'}"></div>`).join("")}
      </div>`:""}
    </div>`;
  }
  return `<div style="background:var(--card);margin:0 12px 8px;border-radius:14px;border:1.5px solid var(--border);padding:10px 12px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <button onclick="calPrevMonth()" style="background:none;border:none;cursor:pointer;font-size:1.2rem;color:var(--muted);padding:2px 8px;border-radius:8px">‹</button>
      <span style="font-size:.88rem;font-weight:800;color:var(--text2)">${yr}年${mo+1}月</span>
      <button onclick="calNextMonth()" style="background:none;border:none;cursor:pointer;font-size:1.2rem;color:var(--muted);padding:2px 8px;border-radius:8px">›</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px">
      ${DOW.map((d,i)=>`<div style="text-align:center;font-size:.62rem;font-weight:800;color:${i===0?'var(--red)':i===6?'var(--blue)':'var(--muted)'};padding:2px 0">${d}</div>`).join("")}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${cells}</div>
    <div id="cal-day-detail" style="margin-top:8px"></div>
    <div style="font-size:.66rem;color:var(--muted2);margin-top:6px">🟢 未完了 ⚫ 完了済み</div>
  </div>`;
}
function calPrevMonth(){calViewMonth--;if(calViewMonth<0){calViewMonth=11;calViewYear--;}renderPlan();}
function calNextMonth(){calViewMonth++;if(calViewMonth>11){calViewMonth=0;calViewYear++;}renderPlan();}
function calDayClick(ds){
  const dayPlans=plans.filter(p=>p.dueDate===ds);
  const detail=$("cal-day-detail");if(!detail)return;
  if(!dayPlans.length){detail.innerHTML=`<div style="font-size:.76rem;color:var(--muted2);padding:4px">${ds}：予定なし</div>`;return;}
  detail.innerHTML=`<div style="font-size:.72rem;font-weight:800;color:var(--muted);margin-bottom:5px">📅 ${ds}</div>`+
    dayPlans.map(p=>`<div style="display:flex;align-items:center;gap:7px;padding:6px 8px;background:var(--bg);border:1.5px solid ${p.done?'var(--border)':'var(--border2)'};border-radius:9px;margin-bottom:4px">
      <div style="width:8px;height:8px;border-radius:50%;background:${p.done?'var(--muted2)':'var(--lime)'};flex-shrink:0"></div>
      <span style="font-size:.82rem;color:${p.done?'var(--muted2)':'var(--text2)'};flex:1;${p.done?'text-decoration:line-through':''}">${esc(p.title)}</span>
      ${!p.done?`<button class="btn-sm" style="font-size:.6rem;padding:2px 7px;flex-shrink:0" onclick="planToToday(${p.id})">今日に</button>`:""}
    </div>`).join("");
}

function submitPlan(){
  const raw=$("plan-input")?.value?.trim();if(!raw)return;

async function sendChatMsg(msg){
  if(!msg?.trim())return;
  const key=localStorage.getItem("paru_gemini_key")||"";
  if(!key){addChatBubble("paru","設定タブでAPIキーを設定してね⚾");return;}
  addChatBubble("user",msg);
  const today=new Date().toISOString().slice(0,10);
  const todayPending=tasks.filter(t=>t.date===today&&!t.done&&!t.skipped).map(t=>t.title);
  const prompt=`# タスク分解リクエスト\n今日の日付: ${today}\n\n## 相談内容\n${msg}\n\n${todayPending.length?`## 今日すでにあるタスク\n${todayPending.map(t=>"- "+t).join("\n")}\n\n`:""}## お願い\n上記の相談内容をタスクに分解して、以下のJSON形式**のみ**で返してください。JSONだけ返してください。\n\`\`\`json\n{\n  "comment": "一言コメント（日本語、2文以内）",\n  "today": [{"title": "今日やること", "time": "morning"}],\n  "plans": [{"title": "今後の予定", "span": "week", "dueDate": "${today}"}]\n}\n\`\`\`\n- today: 今日できる具体的な第一歩を1〜3個\n- plans: 中間目標・締め切りを1〜3個\n- time: morning/afternoon/evening/anytime\n- span: week/month/3m/6m/1y\n- dueDate: YYYY-MM-DD`;
  const model="gemini-2.0-flash"; // 固定
  showChatTyping();
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system_instruction:{parts:[{text:getSys()}]},contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:800,temperature:0.8}})});
    const d=await r.json();hideChatTyping();
    if(d.error){addChatBubble("paru","エラーが出ました："+d.error.message);return;}
    const text=d.candidates?.[0]?.content?.parts?.[0]?.text||"";
    const m1=text.match(/```json\s*([\s\S]*?)```/);const m2=text.match(/\{[\s\S]*?"today"[\s\S]*?\}/);
    const jsonStr=m1?m1[1].trim():m2?m2[0]:null;
    let parsed=null;if(jsonStr){try{parsed=JSON.parse(jsonStr);}catch(e){}}
    if(parsed){addChatBubble("paru",parsed.comment||"タスクに分解しましたよ✨");showChatTaskPreview(parsed);}
    else{addChatBubble("paru",text);}
  }catch(e){hideChatTyping();addChatBubble("paru","通信エラーです…😢");}
}

  const td=todayStr();let count=0;
  pendingChatItems.forEach((item,i)=>{

    else{plans.push({id:Date.now()+Math.random(),title:item.title.trim(),span:item.span||"month",dueDate:item.dueDate||"",done:false,created:td});}

  });

async function requestNotifPermission(){
  if(!("Notification" in window)){toast("このブラウザは通知をサポートしていません");return false;}
  const perm=await Notification.requestPermission();
  if(perm==="granted"){notifEnabled=true;S.set("notifEnabled",true);toast("通知を有効にしました🔔");return true;}
  else{toast("通知が許可されませんでした");return false;}
}

function showInAppNotif(msg){
  const banner=$("notif-banner");
  banner.textContent=msg;banner.style.display="block";
  setTimeout(()=>banner.style.display="none",6000);
}

function fireNotif(msg){
  if(notifEnabled&&Notification.permission==="granted"){
    try{new Notification("秘書っぱる⚾",{body:msg,icon:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>⚾</text></svg>"});}catch(e){}
  }
  showInAppNotif(msg);
}

function checkNotifications(){
  const now=new Date();const h=now.getHours();const m=now.getMinutes();const td=todayStr();
  notifTimes.filter(n=>n.on).forEach(n=>{
    const key=n.id+"_"+td;
    if(n.hour===h&&n.minute===m&&!notifFiredToday[key]){
      notifFiredToday[key]=true;
      fireNotif(n.msg);
    }
  });
}

// 1分ごとに通知チェック
setInterval(checkNotifications,60000);
// 起動時に即チェック（起動直後の通知も拾う）
setTimeout(checkNotifications,3000);

function importData(e){
  const fi=e.target.files[0];if(!fi)return;
  const rd=new FileReader();rd.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.streak!=null){streak=d.streak;S.set("streak",streak);}
      if(d.tasks){tasks=d.tasks;S.set("tasks",tasks);}
      if(d.plans){plans=d.plans;S.set("plans",plans);}
      if(d.lists){lists=d.lists;S.set("lists",lists);}
      if(d.journals){journals=d.journals;S.set("journals",journals);}
      if(d.habits){habits=d.habits;S.set("habits",habits);}
      if(d.weightLog){weightLog=d.weightLog;S.set("weightLog",weightLog);}
      if(d.moodLog){moodLog=d.moodLog;S.set("moodLog",moodLog);}
      if(d.taskTemplates){taskTemplates=d.taskTemplates;S.set("taskTemplates",taskTemplates);}
      updateHeader();buildTabs();
      ({today:renderToday,plan:renderPlan,list:renderList,settings:renderSettings})[currentTab]?.();
      toast("インポート完了！おかえりだがな⚾","2500","success");
    }catch{toast("読み込みエラー… ファイルを確認してね","2500","error");}
  };rd.readAsText(fi);
}

// ══════════════════════════════════════
// REPORTS
// ══════════════════════════════════════
async function generateWeeklyReport(){
  const wk=new Date();wk.setDate(wk.getDate()-7);const wkS=wk.toISOString().slice(0,10);
  const wt=tasks.filter(t=>t.date>=wkS);const done=wt.filter(t=>t.done).length,total=wt.length;
  const wl=weightLog.filter(e=>e.unit==="kg"&&e.date>=wkS);
  const wExtra=wl.length>=2?`\n体重変化：${wl[0].value}kg → ${wl[wl.length-1].value}kg`:"";
  const msg=`今週の実績：タスク${total}件中${done}件完了（達成率${total?Math.round(done/total*100):0}%）、連続${streak}日継続中${wExtra}\nぱるキャラで週次レポートを3文で。褒めてアドバイスして。`;
  const res=await callAI(msg,"週次レポートを作成中…✨");
  weeklyReport={text:res,date:todayStr(),done,total};S.set("weeklyReport",weeklyReport);
  toast("週次レポートを作成しましたよ🌸");if(currentTab==="today")renderToday();
}

async function generateMonthlyReport(){
  const m=new Date().toISOString().slice(0,7);const mt=tasks.filter(t=>t.date?.startsWith(m));
  const done=mt.filter(t=>t.done).length,total=mt.length;
  const msg=`今月の実績：タスク${total}件中${done}件完了（達成率${total?Math.round(done/total*100):0}%）\nぱるキャラで月次レポートを3文で。振り返りと来月への一言を。`;
  const res=await callAI(msg,"月次レポートを作成中…✨");
  monthlyReport={text:res,date:todayStr(),done,total};S.set("monthlyReport",monthlyReport);
  toast("月次レポートを作成しましたよ🌸");if(currentTab==="today")renderToday();
}

// ══════════════════════════════════════
// RECURRING PLANS
// ══════════════════════════════════════
function ensureRecurringPlans(){
  const td=todayStr();const lastRecurring=S.get("lastRecurring")||"";if(lastRecurring===td)return;S.set("lastRecurring",td);
  plans.filter(p=>p.repeat&&p.dueDate&&p.done).forEach(p=>{
    const last=new Date(p.dueDate);let next=new Date(last);
    if(p.repeat==="weekly")next.setDate(last.getDate()+7);if(p.repeat==="monthly")next.setMonth(last.getMonth()+1);
    const nextStr=next.toISOString().slice(0,10);const exists=plans.find(x=>x.title===p.title&&x.dueDate===nextStr);
    if(!exists&&nextStr>=td)plans.push({id:Date.now()+Math.random(),title:p.title,span:p.span,dueDate:nextStr,done:false,created:td,repeat:p.repeat});
  });
  savePlans();
}

// ══════════════════════════════════════
// AUTO BRIEFING
// ══════════════════════════════════════
async function autoBriefing(){
  const td=todayStr();if(lastBriefingDate===td)return;
  const key=localStorage.getItem("paru_gemini_key")||"";if(!key)return;
  lastBriefingDate=td;S.set("lastBriefingDate",td);
  const tt=todayTasksAll();const nearPlans=plans.filter(p=>p.dueDate&&daysUntil(p.dueDate)<=7&&!p.done).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  // 体重の直近変化を含める
  const recentW=weightLog.filter(e=>e.unit==="kg").slice(-2);
  const wNote=recentW.length>=2?`最近の体重：${recentW[0].value}→${recentW[1].value}kg。`:"";
  const todayMood=moodLog.find(m=>m.date===todayStr());
  const moodNote=todayMood?`今日の気分：${todayMood.label}。`:"";
  const msg=`今日${new Date().toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"long"})}のタスク数：${tt.length}件。7日以内の締め切り：${nearPlans.map(p=>p.title+"("+p.dueDate+")").join("、")||"なし"}。${wNote}${moodNote}\nぱるキャラで朝のブリーフィングを2〜3文で。`;
  const res=await callAI(msg,"今日のブリーフィングを準備中…⚾");
  paruMsg=res;S.set("paruMsg",res);if(currentTab==="today")renderToday();
}

// ══════════════════════════════════════
// STREAK / NEW DAY
// ══════════════════════════════════════
function checkNewDay(){
  const last=S.get("last_date");const today=todayStr();
  if(last&&last!==today){
    const days=Math.round((new Date(today)-new Date(last))/864e5);
    // スキップのみの日はストリーク維持
    const yesterdayTasks=tasks.filter(t=>t.date===last);
    const skippedOnly=yesterdayTasks.length>0&&yesterdayTasks.every(t=>t.skipped||t.done);
    if(days===1){streak++;S.set("streak",streak);setTimeout(()=>toast(`🔥 ${streak}日連続！えらいがな⚾`),1500);}
    else if(days>1&&!skippedOnly){streak=1;S.set("streak",streak);setTimeout(()=>toast(`${days}日ぶり！おかえり⚾ 一緒に再スタートしよ`),1200);}
    paruMsg="";S.set("paruMsg","");
  }
  S.set("last_date",today);
}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
async function init(){
  await loadPhotos();
  checkNewDay();
  ensureRecurringPlans();
  ensureTodayHabits();
  updateHeader();
  buildTabs();
  renderToday();
  startSlideshow();
  updateFabVisibility();

  // 同期インジケーター初期表示
  _showSyncStatus(gasUrl?"idle":"idle");
  if(gasUrl){
    // 起動時にGASから最新データを取得
    setTimeout(syncFromGAS, 1500);
  }

  // speechSynthesis: iOSでは音声リストを早めに読み込んでおく
  if("speechSynthesis" in window){
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();
  }

  setTimeout(autoBriefing, 2000);
}
init();
</script>
